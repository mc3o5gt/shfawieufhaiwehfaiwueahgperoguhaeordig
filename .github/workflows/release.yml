name: Build Fedora 42 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:42
      options: --security-opt seccomp=unconfined

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y gcc-c++ git fpc lazarus gtk3-devel

      - name: Checkout zpaqfranz
        uses: actions/checkout@v4
        with:
          repository: fcorbelli/zpaqfranz
          path: zpaqfranz
          ref: main

      - name: Build zpaqfranz
        run: |
          cd zpaqfranz
          g++ -Dunix -O3 -march=native zpaqfranz.cpp -o zpaqfranz -pthread -s
          ./zpaqfranz -v

      - name: Checkout catpaq
        uses: actions/checkout@v4
        with:
          repository: fcorbelli/catpaq
          path: catpaq
          ref: main

      - name: Build catpaq
        run: |
          cd catpaq
          lazbuild catpaq.lpi

      - name: Prepare release bundle
        run: |
          mkdir -p dist
          cp zpaqfranz/zpaqfranz dist/
          cp catpaq/catpaq dist/
          cd dist
          sha256sum zpaqfranz catpaq > SHA256SUMS.txt
          tar czf zpaqfranz-catpaq-fedora42-x86_64.tar.gz \
                  zpaqfranz catpaq SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/zpaqfranz-catpaq-fedora42-x86_64.tar.gz
          name: Fedora 42 x86_64
          draft: false
          prerelease: false
